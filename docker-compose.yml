# PostgreSQL lokal untuk menguji mode produksi.
# Jalankan: docker compose up -d
# Lalu set DATABASE_URL="postgresql://v3bks:v3bks@localhost:5432/v3bks?schema=public"

services:
  postgres:
    image: postgres:16-alpine
    container_name: v3bks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: v3bks
      POSTGRES_PASSWORD: v3bks
      POSTGRES_DB: v3bks
    ports:
      - "5432:5432"
    volumes:
      - v3bks_pgdata:/var/lib/postgresql/data

volumes:
  v3bks_pgdata:
